# Render blueprint (optional). Create the service from this repo, then set ANTHROPIC_API_KEY.
services:
  - type: web
    name: bookleaf-support
    runtime: python
    buildCommand: ./build.sh
    startCommand: cd backend && gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: NODE_VERSION
        value: 20.18.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DATABASE_URL
        fromDatabase: { name: bookleaf-db, property: connectionString }
      - key: ANTHROPIC_API_KEY
        sync: false
databases:
  - name: bookleaf-db
    plan: free
